name: CodeQL

# Static analysis for security problems. Alerts show in the repository's
# Security tab, and on a pull request as review annotations on the lines it
# changes. build-mode none reads the sources without installing or building.
#
# This is the "advanced setup". GitHub's "default setup" (Settings > Code
# security) must stay off: with both on, uploads from this workflow are
# rejected.

on:
  push:
    branches: [main]
  # Not a required check, so skipping pull requests that change only docs
  # leaves nothing pending.
  pull_request:
    paths-ignore: ["**/*.md"]
  # New queries ship with CodeQL releases, so main is checked weekly even when
  # nothing changes.
  schedule:
    - cron: "29 5 * * 2"

permissions: {}

concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # upload the results
    strategy:
      fail-fast: false
      matrix:
        # The site and Worker, and the workflows in .github/.
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
