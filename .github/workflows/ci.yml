name: CI

# Typechecks, lints and builds the site, and checks that the Worker bundles
# the way `wrangler deploy` would, without uploading anything. A push to main
# that passes those checks then deploys to arakun.dev (see "Deploys" in README.md).
# A pull request's build is kept, and the Preview workflow deploys it as a preview.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

# A pull request's runs share a group, so a new push cancels the old run. Pushes
# to main get a group per commit, so every commit keeps its own result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    # The main ruleset can require this name; renaming it blocks every merge.
    name: Typecheck and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the version from packageManager in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Ultracite (Biome): lint and format. `pnpm fix` fixes most of what it finds.
      - run: pnpm check
      - run: pnpm build

      # Bundles the Worker and lists its bindings and assets. No account or
      # token is needed for a dry run.
      - run: pnpm exec wrangler deploy --dry-run

      # worker-configuration.d.ts is generated from wrangler.jsonc, and the
      # typecheck relies on it. A stale copy hides type errors.
      - name: Worker types are up to date
        run: |
          pnpm cf-typegen
          if ! git diff --exit-code -- worker-configuration.d.ts src/routeTree.gen.ts; then
            echo "::error::Generated files are out of date. Run 'pnpm cf-typegen' and 'pnpm build', then commit the result."
            exit 1
          fi

      # preview.yml uploads this build as the pull request's preview. That
      # workflow holds the Cloudflare token; this job has no secret. Hidden
      # files are kept for dist/client/.assetsignore.
      - name: Keep the build for the preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview
          path: |
            dist/client
            dist/server
            !dist/**/*.map
          include-hidden-files: true
          if-no-files-found: error
          # An outsider's preview waits for a maintainer's approval, which can
          # take a while. preview.yml asks for a new CI run if this expires.
          retention-days: 30

  deploy:
    name: Deploy to arakun.dev
    needs: build
    # Only commits on main go live. Pull requests never get this token; their
    # previews are another Worker (preview.yml).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    # The token is an environment secret, so only jobs that name this
    # environment can read it, and the environment can be limited to main.
    environment:
      name: production
      url: https://arakun.dev
    # One deploy at a time, never cancelled halfway. By default a job waiting
    # here is dropped when another arrives, and the arrival may be an older
    # commit that the check below then skips, so nothing deploys. `queue: max`
    # keeps every waiting job instead.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
      queue: max
    steps:
      # Pushes to main build in parallel, so an older commit can reach this
      # job after a newer one has deployed. It must not put the old build
      # back. The newer commit's run deploys main instead.
      - name: Skip if main has moved on
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is at $head now, so $GITHUB_SHA is not deployed."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.latest.outputs.deploy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: steps.latest.outputs.deploy == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # No dependency cache: the job that holds the deploy token installs from
      # the registry, never from a cache another run wrote.
      - if: steps.latest.outputs.deploy == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - if: steps.latest.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile

      # deploy-watch names the build after GITHUB_SHA, so open tabs move to it.
      - if: steps.latest.outputs.deploy == 'true'
        run: pnpm build

      - name: Deploy
        if: steps.latest.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --message "$GITHUB_SHA"
