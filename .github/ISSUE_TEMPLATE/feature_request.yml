name: Feature request
description: Suggest a page, a section or an improvement to arakun.dev.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This form is for the website. Ideas for the Arakun app go to [ArakunHQ/arakun](https://github.com/ArakunHQ/arakun/issues/new/choose).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What were you looking for on the site, and what got in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like the site to show or do. Mockups or examples from other sites help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Where you found the answer instead, or other approaches you considered.
